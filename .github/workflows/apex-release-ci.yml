name: Apex compiled release validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'server.mjs'
      - 'release-store.mjs'
      - 'public/index.html'
      - 'public/astra-ui.js'
      - 'public/notifications-ui.js'
      - 'public/premium.css'
      - 'tests/premium-ui.test.mjs'
      - 'tests/apex-release-delivery.test.mjs'
      - '.github/workflows/apex-release-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check server.mjs
      - run: node --check release-store.mjs
      - run: npm test
