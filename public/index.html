<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XauCloud Apex</title>
<meta name="theme-color" content="#0a0b0f">
<style>
:root{
  --bg:#0a0b0f; --bg-elev:#13151b; --bg-elev-2:#1a1d26; --bg-elev-3:#20242f;
  --border:#262b38; --border-soft:#1c202a;
  --text:#f2f3f6; --text-dim:#a2a8b8; --text-faint:#616a80;
  --gold:#e8b84b; --gold-soft:#3a2f15; --gold-text:#f3cd6f;
  --green:#34d399; --green-soft:#0f2b22;
  --red:#f87171; --red-soft:#2c1518;
  --amber:#fbbf24; --amber-soft:#2b2210;
  --blue:#60a5fa; --blue-soft:#12233d;
  --radius:14px; --radius-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
input,select{background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
button{cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(1200px 600px at 50% -10%, rgba(232,184,75,.08), transparent 60%), var(--bg);}
.login-card{width:100%;max-width:420px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--gold),#b8862c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1408;font-size:16px}
.brand-name{font-weight:700;letter-spacing:.02em;font-size:15px;color:var(--text-dim)}
.login-card h1{font-size:24px;margin:4px 0 8px;letter-spacing:-.01em}
.login-card p{color:var(--text-dim);margin:0 0 22px;font-size:14px}
.license-input{text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:center;font-size:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:12px 18px;min-height:46px;font-weight:600;font-size:14.5px;width:100%;transition:filter .15s,transform .05s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(145deg,var(--gold),#c99a34);color:#1a1408}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-ghost{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1px solid #4a2226}
.form-row{margin-top:16px}
.err-box{margin-top:14px;background:var(--red-soft);border:1px solid #4a2226;color:#ffb4b4;padding:10px 12px;border-radius:var(--radius-sm);font-size:13.5px;display:none}
.login-foot{margin-top:22px;text-align:center;font-size:12px;color:var(--text-faint)}

/* ---------- shell ---------- */
#app-shell{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,11,15,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);padding:calc(10px + var(--safe-t)) 16px 10px}
.topbar-inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.topbar-brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.topbar-brand .brand-mark{width:26px;height:26px;font-size:12px;border-radius:7px}
.topbar-brand span{font-weight:800;letter-spacing:.03em;font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.pill-dot{width:6px;height:6px;border-radius:50%}
.pill-green{background:var(--green-soft);color:var(--green);border-color:#134a37}
.pill-red{background:var(--red-soft);color:var(--red);border-color:#4a2226}
.pill-amber{background:var(--amber-soft);color:var(--amber);border-color:#4d3c11}
.pill-blue{background:var(--blue-soft);color:var(--blue);border-color:#1d3a63}
.pill-gray{background:var(--bg-elev-3);color:var(--text-faint);border-color:var(--border)}

.layout{display:flex;max-width:1200px;margin:0 auto}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:18px 16px calc(90px + var(--safe-b))}
@media(min-width:900px){
  .sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;padding:24px 12px;gap:2px;border-right:1px solid var(--border-soft);min-height:calc(100vh - 57px);position:sticky;top:57px;align-self:flex-start}
  .main{padding:24px 28px 40px}
  .bottomnav{display:none!important}
}
.navitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius-sm);color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:600;border:none;background:none;text-align:left;width:100%}
.navitem:hover{background:var(--bg-elev-2);color:var(--text)}
.navitem.active{background:var(--gold-soft);color:var(--gold-text)}
.navitem .ic{width:18px;text-align:center;font-size:15px}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(15,16,21,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border-soft);padding:6px 4px calc(6px + var(--safe-b))}
.bottomnav .navitem{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;text-align:center;border-radius:10px}
.bottomnav .navitem .ic{font-size:18px}

.page-title{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.page-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 20px}

.card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 14px;font-size:14px;color:var(--text-dim);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat-tile{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px}
.stat-tile .label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px}
.stat-tile .value{font-size:22px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat-tile .value.pos{color:var(--green)}
.stat-tile .value.neg{color:var(--red)}
.stat-tile .sub{font-size:11.5px;color:var(--text-faint);margin-top:4px}

.progress-wrap{margin-top:6px}
.progress-track{height:12px;border-radius:99px;background:var(--bg-elev-3);overflow:hidden;border:1px solid var(--border-soft)}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#f3cd6f);transition:width .4s ease}
.progress-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-dim)}
.progress-big{font-size:34px;font-weight:800;color:var(--gold-text)}

.empty-state{text-align:center;padding:34px 16px;color:var(--text-dim)}
.empty-state .ic{font-size:34px;margin-bottom:10px}
.empty-state h4{margin:0 0 6px;color:var(--text);font-size:16px}
.empty-state p{margin:0;font-size:13.5px;color:var(--text-faint);max-width:340px;margin:0 auto}

.stepper{display:flex;align-items:center;justify-content:center;gap:0;margin:18px 0 6px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center}
.step .dot{width:14px;height:14px;border-radius:50%;background:var(--bg-elev-3);border:2px solid var(--border)}
.step.active .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.step .lbl{font-size:11.5px;color:var(--text-faint);font-weight:600}
.step.active .lbl{color:var(--gold-text)}
.step-line{flex:0 0 40px;height:2px;background:var(--border);margin-bottom:20px}
.step-line.active{background:var(--gold)}

.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.03em}
.badge-buy{background:var(--green-soft);color:var(--green)}
.badge-sell{background:var(--red-soft);color:var(--red)}
.badge-target{background:var(--green-soft);color:var(--green)}
.badge-protected{background:var(--blue-soft);color:var(--blue)}
.badge-stopout{background:var(--red-soft);color:var(--red)}

.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;gap:12px}
.row:last-child{border-bottom:none}
.row .k{color:var(--text-dim)}
.row .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.hist-item{border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden}
.hist-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--bg-elev-2)}
.hist-head .grow{flex:1;min-width:0}
.hist-head .date{font-size:11.5px;color:var(--text-faint)}
.hist-head .pct{font-weight:800;font-variant-numeric:tabular-nums}
.hist-body{padding:12px 14px;display:none}
.hist-item.open .hist-body{display:block}
.hist-item.open .chev{transform:rotate(180deg)}
.chev{transition:transform .15s;color:var(--text-faint)}

.feed-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.feed-item:last-child{border-bottom:none}
.feed-item .t{color:var(--text-faint);font-size:11.5px;white-space:nowrap;padding-top:1px}
.feed-item .txt{color:var(--text)}

.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);gap:12px}
.toggle-row:last-child{border-bottom:none}
.toggle-row .lbl{font-weight:600;font-size:14px}
.toggle-row .hint{font-size:12px;color:var(--text-faint);margin-top:2px}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;background:var(--bg-elev-3);border:1px solid var(--border);border-radius:99px;transition:background .15s}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .track{background:var(--gold)}
.switch input:checked + .track + .knob{transform:translateX(20px)}
.switch input:checked ~ .knob{transform:translateX(20px)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}

.warn-banner{background:var(--amber-soft);border:1px solid #4d3c11;color:var(--amber);padding:12px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:16px}
.details-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0}
.details-toggle h3{margin:0}
#advanced-body{display:none;margin-top:8px}
#advanced-body.open{display:block}

.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--bg-elev-3);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red-soft);color:#ffb4b4;border-color:#4a2226}

.skel{background:linear-gradient(90deg,var(--bg-elev-2) 25%,var(--bg-elev-3) 37%,var(--bg-elev-2) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:8px}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

.acct-strip{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:16px}
.acct-strip .item .k{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em}
.acct-strip .item .v{font-weight:700;font-size:14px;margin-top:2px}

.layer-list{margin-top:10px}
.layer-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.layer-row:last-child{border-bottom:none}

.container{max-width:640px}
.center-note{text-align:center;color:var(--text-faint);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand"><div class="brand-mark">X</div><div class="brand-name">XAUCLOUD · PRIVATE</div></div>
    <h1>XauCloud Apex</h1>
    <p>Enter your Apex license to access your trading command center.</p>
    <form id="login-form">
      <input class="license-input" id="license-input" placeholder="APEX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="form-row"><button class="btn btn-primary" id="login-btn" type="submit">Continue</button></div>
    </form>
    <div class="err-box" id="login-err"></div>
    <div class="login-foot">Private access only. Contact the account owner for a license.</div>
  </div>
</div>

<div id="app-shell">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand"><div class="brand-mark">X</div><span>XAUCLOUD APEX</span></div>
      <div class="pills" id="status-pills"></div>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var STATE = { me:null, page:'dashboard', pollTimer:null, adminToken:null };

var NAV = [
  {id:'dashboard', label:'Dashboard', ic:'&#9679;'},
  {id:'campaigns', label:'Campaigns', ic:'&#9670;'},
  {id:'history', label:'History', ic:'&#8635;'},
  {id:'learning', label:'Learning', ic:'&#9733;'},
  {id:'settings', label:'Settings', ic:'&#9881;'},
  {id:'account', label:'Account', ic:'&#9786;'}
];

// ---------- api ----------
function api(path, opts){
  opts = opts || {};
  var o = { method: opts.method||'GET', headers: Object.assign({}, opts.headers||{}), credentials:'same-origin' };
  if (opts.body !== undefined){ o.body = JSON.stringify(opts.body); o.headers['content-type']='application/json'; }
  return fetch(path, o).then(function(r){
    return r.text().then(function(t){
      var data = null; try{ data = t? JSON.parse(t): {}; }catch(e){ data = {}; }
      if (!r.ok){ var err = new Error(data.error||('http_'+r.status)); err.status=r.status; err.data=data; throw err; }
      return data;
    });
  });
}

// ---------- formatting ----------
function fmtMoney(v, cur){
  if (v===undefined||v===null||!isFinite(v)) return '—';
  var s = Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return (cur==='USD'||!cur? '$':'') + s + (cur&&cur!=='USD'? ' '+cur:'');
}
function fmtPct(v, digits){
  if (v===undefined||v===null||!isFinite(v)) return '—';
  digits = digits===undefined?1:digits;
  return (v>=0?'+':'') + Number(v).toFixed(digits) + '%';
}
function fmtAgo(iso){
  if (!iso) return 'never';
  var s = Math.max(0,(Date.now()-Date.parse(iso))/1000);
  if (s<5) return 'just now';
  if (s<60) return Math.floor(s)+'s ago';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function fmtDate(iso){
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function pill(text, tone, dotColor){
  return '<span class="pill pill-'+tone+'"><span class="pill-dot" style="background:'+ (dotColor||'currentColor') +'"></span>'+esc(text)+'</span>';
}

function toast(msg, isErr){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr?' err':'');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.className='toast'; }, 3200);
}

// ---------- session bootstrap ----------
function boot(){
  api('/api/auth/me').then(function(me){
    STATE.me = me;
    showApp();
    if (STATE.page!=='admin') startPolling();
  }).catch(function(){
    showLogin();
  });
}

function showLogin(){
  document.getElementById('login').style.display='flex';
  document.getElementById('app-shell').style.display='none';
  stopPolling();
}
function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app-shell').style.display='block';
  renderNav();
  route();
}

document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  var key = document.getElementById('license-input').value.trim().toUpperCase();
  var errBox = document.getElementById('login-err');
  var btn = document.getElementById('login-btn');
  errBox.style.display='none';
  if (!key){ errBox.textContent='Enter your Apex license key.'; errBox.style.display='block'; return; }
  btn.disabled = true; btn.textContent='Checking...';
  api('/api/auth/login', {method:'POST', body:{license:key}}).then(function(){
    btn.disabled=false; btn.textContent='Continue';
    boot();
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Continue';
    var msgs = {
      LICENSE_NOT_FOUND: 'License not found. Check the key and try again.',
      LICENSE_EXPIRED: 'This license has expired.',
      LICENSE_DISABLED: 'This license has been disabled.',
      too_many_attempts: 'Too many attempts. Please wait a few minutes and try again.',
      license_required: 'Enter your Apex license key.'
    };
    errBox.textContent = msgs[e.message] || 'Unable to verify license. Please try again.';
    errBox.style.display='block';
  });
});

function logout(){
  api('/api/auth/logout', {method:'POST'}).then(function(){
    STATE.me = null;
    stopPolling();
    showLogin();
  });
}

// ---------- polling ----------
function startPolling(){
  stopPolling();
  STATE.pollTimer = setInterval(function(){
    api('/api/auth/me').then(function(me){
      STATE.me = me;
      renderStatusPills();
      if (['dashboard','campaigns','history','learning'].indexOf(STATE.page)>=0) renderPage();
    }).catch(function(e){
      if (e.status===401){ STATE.me=null; stopPolling(); showLogin(); }
    });
  }, 8000);
}
function stopPolling(){ if (STATE.pollTimer) clearInterval(STATE.pollTimer); STATE.pollTimer=null; }

// ---------- routing ----------
window.addEventListener('hashchange', route);
function route(){
  var h = (location.hash||'#dashboard').replace('#','');
  if (h.indexOf('admin')===0){ STATE.page='admin'; stopPolling(); renderAdmin(); return; }
  var valid = NAV.some(function(n){return n.id===h});
  STATE.page = valid? h : 'dashboard';
  renderNav();
  renderPage();
  if (!STATE.pollTimer && STATE.me) startPolling();
}

function renderNav(){
  var itemsHtml = NAV.map(function(n){
    return '<button class="navitem'+(STATE.page===n.id?' active':'')+'" data-nav="'+n.id+'"><span class="ic">'+n.ic+'</span><span>'+n.label+'</span></button>';
  }).join('');
  var sidebar = document.getElementById('sidebar');
  var bottomnav = document.getElementById('bottomnav');
  sidebar.innerHTML = itemsHtml + '<button class="navitem" id="logout-btn" style="margin-top:auto"><span class="ic">&#10162;</span><span>Sign Out</span></button>';
  bottomnav.innerHTML = NAV.slice(0,5).map(function(n){
    return '<button class="navitem'+(STATE.page===n.id?' active':'')+'" data-nav="'+n.id+'" style="flex:1"><span class="ic">'+n.ic+'</span><span>'+n.label+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function(el){
    el.addEventListener('click', function(){ location.hash = '#'+el.getAttribute('data-nav'); });
  });
  var lo = document.getElementById('logout-btn');
  if (lo) lo.addEventListener('click', logout);
  renderStatusPills();
}

function renderStatusPills(){
  var me = STATE.me || {};
  var wrap = document.getElementById('status-pills');
  var parts = [];
  parts.push(pill(me.armed? 'Apex Armed':'Apex Disarmed', me.armed?'green':'gray'));
  var mt5 = (me.mt5&&me.mt5.status) || 'DISCONNECTED';
  parts.push(pill('MT5 '+ (mt5==='CONNECTED'?'Connected':mt5==='STALE'?'Stale':'Disconnected'), mt5==='CONNECTED'?'green':mt5==='STALE'?'amber':'red'));
  var ls = (me.license&&me.license.status) || 'LICENSE_NOT_FOUND';
  var licMap = {ACTIVE:['License Active','green'], LICENSE_EXPIRED:['License Expired','red'], LICENSE_DISABLED:['License Disabled','red'], ACCOUNT_MISMATCH:['Account Mismatch','amber'], LICENSE_NOT_FOUND:['License Not Found','red']};
  var lm = licMap[ls] || licMap.LICENSE_NOT_FOUND;
  parts.push(pill(lm[0], lm[1]));
  wrap.innerHTML = parts.join('');
}

// ---------- page render dispatch ----------
function renderPage(){
  var main = document.getElementById('main');
  var me = STATE.me || {};
  if (STATE.page==='dashboard') main.innerHTML = pageDashboard(me);
  else if (STATE.page==='campaigns') main.innerHTML = pageCampaigns(me);
  else if (STATE.page==='history') main.innerHTML = pageHistory(me);
  else if (STATE.page==='learning') main.innerHTML = pageLearning(me);
  else if (STATE.page==='settings') { main.innerHTML = pageSettings(me); wireSettings(me); }
  else if (STATE.page==='account') main.innerHTML = pageAccount(me);
  wireDashboardControls();
}

// ---------- Dashboard ----------
function pageDashboard(me){
  if (!me.dataAvailable){
    return '<h1 class="page-title">Dashboard</h1><p class="page-sub">Live account overview</p>' + dataUnavailableCard(me);
  }
  var acc = me.account || {};
  var camp = me.campaign;
  var html = '<h1 class="page-title">Dashboard</h1><p class="page-sub">Live account overview · updated '+esc(fmtAgo(acc.asOf))+'</p>';

  html += '<div class="card"><div class="acct-strip">'
    + '<div class="item"><div class="k">Account Profile</div><div class="v">'+esc(me.accountProfile||'—')+'</div></div>'
    + '<div class="item"><div class="k">Broker</div><div class="v">'+esc(acc.broker||'Not reported')+'</div></div>'
    + '<div class="item"><div class="k">MT5 Account</div><div class="v">'+esc(acc.account||'—')+'</div></div>'
    + '<div class="item"><div class="k">Currency</div><div class="v">'+esc(acc.currency||'—')+'</div></div>'
    + '</div></div>';

  html += '<div class="grid-stats">'
    + statTile('Balance', fmtMoney(acc.balance, acc.currency))
    + statTile('Equity', fmtMoney(acc.equity, acc.currency))
    + statTile('Free Margin', fmtMoney(acc.freeMargin, acc.currency))
    + statTile('Current P/L', camp? fmtMoney(camp.floatingPL, acc.currency): '—', camp? (camp.floatingPL>=0?'pos':'neg'):'')
    + '</div>';

  if (camp){
    html += campaignProgressCard(camp, acc.currency);
    html += campaignSummaryCard(camp, acc.currency, false);
  } else {
    html += watchingCard(me);
  }

  html += recentFeedCard(me.recentHuman||[]);
  html += armDisarmCard(me);
  return html;
}

function dataUnavailableCard(me){
  var ls = (me.license&&me.license.status)||'LICENSE_NOT_FOUND';
  if (ls!=='ACTIVE'){
    var msg = {
      LICENSE_EXPIRED:'Your Apex license has expired. Contact the account owner to renew.',
      LICENSE_DISABLED:'Your Apex license has been disabled.',
      ACCOUNT_MISMATCH:'This license is bound to a different MT5 account. Contact the account owner.',
      LICENSE_NOT_FOUND:'License not found.'
    }[ls] || 'License is not active.';
    return '<div class="card"><div class="empty-state"><div class="ic">&#128274;</div><h4>'+esc(ls.replace(/_/g,' '))+'</h4><p>'+esc(msg)+'</p></div></div>';
  }
  return '<div class="card"><div class="empty-state"><div class="ic">&#128225;</div><h4>MT5 DISCONNECTED</h4><p>Waiting for the Apex EA to contact the backend for the first time. Attach the EA in MT5 with your license key to begin.</p></div></div>';
}

function statTile(label, value, cls){
  return '<div class="stat-tile"><div class="label">'+esc(label)+'</div><div class="value'+(cls?' '+cls:'')+'">'+value+'</div></div>';
}

function campaignProgressCard(camp, cur){
  var pct = Math.round(camp.progressPct||0);
  return '<div class="card"><h3>Target Progress</h3>'
    + '<div class="row"><span class="k">Starting Equity</span><span class="v">'+fmtMoney(camp.startEquity,cur)+'</span></div>'
    + '<div class="row"><span class="k">Current Equity</span><span class="v">'+fmtMoney(camp.currentEquity,cur)+'</span></div>'
    + '<div class="row"><span class="k">Target Equity</span><span class="v">'+fmtMoney(camp.targetEquity,cur)+'</span></div>'
    + '<div class="row"><span class="k">Campaign Profit</span><span class="v">'+fmtPct(camp.profitPct)+'</span></div>'
    + '<div class="row"><span class="k">Target</span><span class="v">'+fmtPct(camp.targetPct,0)+'</span></div>'
    + '<div class="progress-wrap"><div class="progress-big">'+pct+'%</div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+Math.min(100,Math.max(0,pct))+'%"></div></div></div>'
    + '</div>';
}

function campaignSummaryCard(camp, cur, showLayers){
  var badge = camp.direction==='BUY'? '<span class="badge badge-buy">ACTIVE BUY CAMPAIGN</span>' : '<span class="badge badge-sell">ACTIVE SELL CAMPAIGN</span>';
  var html = '<div class="card"><h3>Active Campaign</h3>'
    + '<div style="margin-bottom:10px">'+badge+'</div>'
    + '<div class="row"><span class="k">Started</span><span class="v">'+esc(fmtDate(camp.startedAt))+'</span></div>'
    + '<div class="row"><span class="k">Total Lots</span><span class="v">'+Number(camp.totalVolume||0).toFixed(2)+'</span></div>'
    + '<div class="row"><span class="k">Layers</span><span class="v">'+esc(camp.layers)+'</span></div>'
    + '<div class="row"><span class="k">Floating P/L</span><span class="v">'+fmtMoney(camp.floatingPL,cur)+'</span></div>'
    + '<div class="row"><span class="k">Campaign ID</span><span class="v" style="font-size:11px;color:var(--text-faint)">'+esc(camp.campaignId)+'</span></div>';
  if (showLayers && camp.layerDetail && camp.layerDetail.length){
    html += '<div class="layer-list"><h3 style="margin-top:14px">Open Layers</h3>';
    camp.layerDetail.forEach(function(l){
      html += '<div class="layer-row"><span>Layer '+esc(l.layer)+' · '+Number(l.volume||0).toFixed(2)+' lots</span><span style="color:var(--text-faint)">@ '+Number(l.price||0).toFixed(2)+'</span></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function watchingCard(me){
  var recent = (me.recentHuman||[])[0];
  var watching = recent && recent.type==='WATCH_ARMED' && (Date.now()-Date.parse(recent.ts))<20*60*1000;
  return '<div class="card"><div class="empty-state"><div class="ic">&#128269;</div><h4>APEX IS WATCHING</h4>'
    + '<p>'+(watching? 'A potential setup was recently detected — waiting for confirmation.' : 'Waiting for a high-quality setup.')+'</p></div>'
    + '<div class="stepper">'
    + '<div class="step'+(!watching?' active':'')+'"><div class="dot"></div><div class="lbl">Scanning</div></div>'
    + '<div class="step-line'+(watching?' active':'')+'"></div>'
    + '<div class="step'+(watching?' active':'')+'"><div class="dot"></div><div class="lbl">Confirming Setup</div></div>'
    + '</div></div>';
}

function recentFeedCard(items){
  if (!items.length) return '';
  var html = '<div class="card"><h3>Recent Activity</h3>';
  items.slice(0,8).forEach(function(e){
    html += '<div class="feed-item"><span class="t">'+esc(fmtAgo(e.ts))+'</span><span class="txt">'+esc(e.text)+'</span></div>';
  });
  html += '</div>';
  return html;
}

function armDisarmCard(me){
  return '<div class="card"><div class="toggle-row"><div><div class="lbl">Apex Armed</div><div class="hint">When disarmed, Apex will not start new campaigns or add new layers. Active positions are still managed.</div></div>'
    + '<label class="switch"><input type="checkbox" id="arm-toggle" '+(me.armed?'checked':'')+'><span class="track"></span><span class="knob"></span></label></div></div>';
}

function wireDashboardControls(){
  var t = document.getElementById('arm-toggle');
  if (t) t.addEventListener('change', function(){
    var val = t.checked;
    t.disabled = true;
    api('/api/session/config', {method:'POST', body:{armed:val}}).then(function(){
      toast(val? 'Apex armed' : 'Apex disarmed');
      return api('/api/auth/me');
    }).then(function(me){ STATE.me=me; renderStatusPills(); t.disabled=false; })
    .catch(function(){ toast('Could not update — try again', true); t.checked=!val; t.disabled=false; });
  });
}

// ---------- Campaigns ----------
function pageCampaigns(me){
  var html = '<h1 class="page-title">Campaigns</h1><p class="page-sub">What Apex is doing right now</p>';
  if (!me.dataAvailable) return html + dataUnavailableCard(me);
  if (me.campaign) html += campaignProgressCard(me.campaign, (me.account||{}).currency) + campaignSummaryCard(me.campaign, (me.account||{}).currency, true);
  else html += watchingCard(me);
  return html;
}

// ---------- History ----------
function pageHistory(me){
  var html = '<h1 class="page-title">History</h1><p class="page-sub">Completed campaigns</p>';
  if (!me.dataAvailable) return html + dataUnavailableCard(me);
  var hist = me.history||[];
  if (!hist.length){
    html += '<div class="card"><div class="empty-state"><div class="ic">&#128203;</div><h4>NO COMPLETED CAMPAIGNS YET</h4><p>Completed campaigns will appear here once Apex closes its first basket.</p></div></div>';
    return html;
  }
  hist.forEach(function(h, i){

      + '<div class="hist-head" onclick="document.getElementById(\'hist-'+i+'\').classList.toggle(\'open\')">'

      + '<span class="badge '+badgeCls+'">'+esc(h.outcomeLabel)+'</span>'
      + '<span class="chev">&#9662;</span>'
      + '</div>'
      + '<div class="hist-body">'
      + '<div class="row"><span class="k">Start Equity</span><span class="v">'+fmtMoney(h.startEquity)+'</span></div>'
      + '<div class="row"><span class="k">End Equity</span><span class="v">'+fmtMoney(h.endEquity)+'</span></div>'
      + '<div class="row"><span class="k">Layers</span><span class="v">'+esc(h.layers)+'</span></div>'
      + '<div class="row"><span class="k">Duration</span><span class="v">'+(h.durationSec? Math.round(h.durationSec/60)+' min':'—')+'</span></div>'
      + '<div class="row"><span class="k">Signature</span><span class="v" style="font-size:11px;color:var(--text-faint)">'+esc(h.signature||'—')+'</span></div>'
      + '</div></div>';
  });
  return html;
}

// ---------- Learning ----------
function pageLearning(me){
  var html = '<h1 class="page-title">Learning</h1><p class="page-sub">How Apex is adapting over time</p>';
  if (!me.dataAvailable) return html + dataUnavailableCard(me);
  var L = me.learning || {};
  if (!L.completedCampaigns){
    html += '<div class="card"><div class="empty-state"><div class="ic">&#129504;</div><h4>NO COMPLETED CAMPAIGNS YET</h4><p>Apex needs completed campaigns before it has anything to learn from.</p></div></div>';
    return html;
  }
  html += '<div class="card"><div style="margin-bottom:12px">'+pill(L.authority==='BOUNDED_ADAPTIVE'?'Bounded Adaptive':'Observing', L.authority==='BOUNDED_ADAPTIVE'?'green':'blue')+'</div>'
    + '<div class="grid-stats">'
    + statTile('Completed Campaigns', L.completedCampaigns)
    + statTile('Target Hits', L.targetHits, 'pos')
    + statTile('Protected Exits', L.protectedExits)
    + statTile('Genuine Failures', L.genuineFailures, L.genuineFailures?'neg':'')
    + '</div>'
    + '<div class="row"><span class="k">Positive Outcome Rate</span><span class="v">'+fmtPct(L.positiveOutcomeRate*100,1)+'</span></div>'
    + '<div class="row"><span class="k">Entry Score Adjustment</span><span class="v">'+(L.entryScoreAdjustment>0?'+':'')+L.entryScoreAdjustment+'</span></div>'
    + '<div class="row"><span class="k">Add Score Adjustment</span><span class="v">'+(L.addScoreAdjustment>0?'+':'')+L.addScoreAdjustment+'</span></div>'
    + '</div>';

  var fi = L.featureInsights||{};
  var names = Object.keys(fi);
  if (names.length){
    html += '<div class="card"><h3>Recent Setup Insights</h3>';
    names.forEach(function(name){
      Object.keys(fi[name]).forEach(function(key){
        var b = fi[name][key];
        html += '<div class="row"><span class="k">'+esc(key)+'</span><span class="v">'+(b.positiveRate==null? 'Insufficient sample ('+b.campaigns+')' : fmtPct(b.positiveRate*100,0))+'</span></div>';
      });
    });
    html += '</div>';
  }
  return html;
}

function advField(label, id, value, disabled){
  return '<div class="field"><label>'+esc(label)+'</label><input type="number" step="any" id="f-'+id+'" value="'+esc(value)+'" '+(disabled?'disabled':'')+'></div>';
}
function wireSettings(me){
  wireDashboardControls();
  var advToggle = document.getElementById('advanced-toggle');
  if (advToggle) advToggle.addEventListener('click', function(){
    document.getElementById('advanced-body').classList.toggle('open');
  });
  var save1 = document.getElementById('save-settings');
  if (save1) save1.addEventListener('click', function(){
    var payload = {
      accountProfile: document.getElementById('f-accountProfile').value,
      normalTargetProfitPct: Number(document.getElementById('f-normalTargetProfitPct').value),
      baseMarginPct: Number(document.getElementById('f-baseMarginPct').value),
      layerMultiplier: Number(document.getElementById('f-layerMultiplier').value),
      maxLayers: Number(document.getElementById('f-maxLayers').value),
      normalProfitFloorEnabled: document.getElementById('f-normalProfitFloorEnabled').checked
    };
    saveConfig(payload);
  });
  var save2 = document.getElementById('save-advanced');
  if (save2) save2.addEventListener('click', function(){
    var payload = {
      entryScore: Number(document.getElementById('f-entryScore').value),
      addScore: Number(document.getElementById('f-addScore').value),
      impulseAtr: Number(document.getElementById('f-impulseAtr').value),
      sweepAtr: Number(document.getElementById('f-sweepAtr').value),
      rejectionBars: Number(document.getElementById('f-rejectionBars').value),
      watchExpiryMinutes: Number(document.getElementById('f-watchExpiryMinutes').value),
      rejectionZoneAtr: Number(document.getElementById('f-rejectionZoneAtr').value),
      addSpacingAtr: Number(document.getElementById('f-addSpacingAtr').value),
      requireM3Confirm: document.getElementById('f-requireM3Confirm').checked,
      requireM5Context: document.getElementById('f-requireM5Context').checked
    };
    saveConfig(payload);
  });
}
function saveConfig(payload){
  api('/api/session/config', {method:'POST', body:payload}).then(function(){
    toast('Settings saved');
    return api('/api/auth/me');
  }).then(function(me){ STATE.me=me; if (STATE.page==='settings') renderPage(); })
  .catch(function(){ toast('Could not save settings', true); });
}

// ---------- Admin (separate protected route, ADMIN_TOKEN, in-memory only) ----------
function renderAdmin(){
  document.getElementById('login').style.display='none';
  document.getElementById('app-shell').style.display='block';
  document.getElementById('sidebar').innerHTML='';
  document.getElementById('bottomnav').innerHTML='';
  document.getElementById('status-pills').innerHTML = pill('Admin Console','amber');
  var main = document.getElementById('main');
  if (!STATE.adminToken){
    main.innerHTML = '<div class="container"><h1 class="page-title">Admin Access</h1><p class="page-sub">Internal administration only. Not the normal Apex login.</p>'
      + '<div class="card"><div class="field"><label>Admin Token</label><input type="password" id="admin-token-input"></div>'
      + '<button class="btn btn-primary" id="admin-token-go">Continue</button></div></div>';
    document.getElementById('admin-token-go').addEventListener('click', function(){
      STATE.adminToken = document.getElementById('admin-token-input').value.trim();
      renderAdmin();
    });
    return;
  }
  main.innerHTML = '<div class="container"><h1 class="page-title">Admin Console</h1><p class="page-sub">License issuance and raw backend state.</p><div id="admin-body"><div class="skel" style="height:200px"></div></div></div>';
  adminApi('/api/admin/licenses').then(function(d){
    renderAdminLicenses(d.licenses||[]);
  }).catch(function(){
    document.getElementById('admin-body').innerHTML = '<div class="card"><div class="empty-state"><h4>Invalid admin token</h4></div></div>';
    STATE.adminToken = null;
  });
}
function adminApi(path, opts){
  opts = opts||{};
  opts.headers = Object.assign({}, opts.headers||{}, {authorization:'Bearer '+STATE.adminToken});
  return api(path, opts);
}
function renderAdminLicenses(licenses){
  var html = '<div class="card"><h3>Issue New License</h3>'
    + '<div class="field-grid">'
    + '<div class="field"><label>Account Profile</label><select id="new-lic-profile"><option value="NORMAL">NORMAL</option><option value="UNLIMITED">UNLIMITED</option></select></div>'
    + '<div class="field"><label>Customer (optional)</label><input id="new-lic-customer"></div>'
    + '<div class="field"><label>Expires (optional, YYYY-MM-DD)</label><input id="new-lic-expiry"></div>'
    + '</div><button class="btn btn-primary" id="new-lic-btn">Create License</button></div>';

  html += '<div class="card"><h3>Licenses</h3>';
  if (!licenses.length) html += '<div class="empty-state"><p>No licenses issued yet.</p></div>';
  licenses.forEach(function(l){
    html += '<div class="row" style="flex-wrap:wrap;align-items:flex-start">'
      + '<span class="k" style="flex:1;min-width:200px"><b>'+esc(l.key)+'</b><br><span style="color:var(--text-faint);font-size:11.5px">'+esc(l.status)+' · '+esc(l.accountProfile)+' · account: '+esc(l.account||'unbound')+'</span></span>'
      + '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;min-height:32px" data-toggle-lic="'+esc(l.key)+'" data-status="'+esc(l.status)+'">'+(l.status==='ACTIVE'?'Disable':'Enable')+'</button>'
      + '</div>';
  });
  html += '</div>';
  document.getElementById('admin-body').innerHTML = html;
  document.getElementById('new-lic-btn').addEventListener('click', function(){
    var expiry = document.getElementById('new-lic-expiry').value.trim();
    adminApi('/api/admin/licenses', {method:'POST', body:{
      accountProfile: document.getElementById('new-lic-profile').value,
      customer: document.getElementById('new-lic-customer').value.trim(),
      expiresAt: expiry? new Date(expiry).toISOString() : null
    }}).then(function(d){
      toast('License created: '+d.license.key);
      renderAdmin();
    }).catch(function(){ toast('Failed to create license', true); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-lic]'), function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-toggle-lic');
      var cur = btn.getAttribute('data-status');
      adminApi('/api/admin/licenses', {method:'POST', body:{key:key, status: cur==='ACTIVE'?'DISABLED':'ACTIVE'}}).then(function(){
        renderAdmin();
      });
    });
  });
}

boot();
})();
</script>
</body>
</html>
