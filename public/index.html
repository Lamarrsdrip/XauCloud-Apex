<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XauCloud Apex</title>
<meta name="theme-color" content="#0a0b0f">
<style>
:root{
  --bg:#0a0b0f; --bg-elev:#13151b; --bg-elev-2:#1a1d26; --bg-elev-3:#20242f;
  --border:#262b38; --border-soft:#1c202a;
  --text:#f2f3f6; --text-dim:#a2a8b8; --text-faint:#616a80;
  --gold:#e8b84b; --gold-soft:#3a2f15; --gold-text:#f3cd6f;
  --green:#34d399; --green-soft:#0f2b22;
  --red:#f87171; --red-soft:#2c1518;
  --amber:#fbbf24; --amber-soft:#2b2210;
  --blue:#60a5fa; --blue-soft:#12233d;
  --radius:14px; --radius-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  touch-action:manipulation;
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
input,select{background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
button{cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(1200px 600px at 50% -10%, rgba(232,184,75,.08), transparent 60%), var(--bg);}
.login-card{width:100%;max-width:420px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--gold),#b8862c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1408;font-size:16px}
.brand-name{font-weight:700;letter-spacing:.02em;font-size:15px;color:var(--text-dim)}
.login-card h1{font-size:24px;margin:4px 0 8px;letter-spacing:-.01em}
.login-card p{color:var(--text-dim);margin:0 0 22px;font-size:14px}
.license-input{text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:center;font-size:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:12px 18px;min-height:46px;font-weight:600;font-size:14.5px;width:100%;transition:filter .15s,transform .05s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(145deg,var(--gold),#c99a34);color:#1a1408}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-ghost{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1px solid #4a2226}
.form-row{margin-top:16px}
.err-box{margin-top:14px;background:var(--red-soft);border:1px solid #4a2226;color:#ffb4b4;padding:10px 12px;border-radius:var(--radius-sm);font-size:13.5px;display:none}
.login-foot{margin-top:22px;text-align:center;font-size:12px;color:var(--text-faint)}

/* ---------- shell ---------- */
#app-shell{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,11,15,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);padding:calc(10px + var(--safe-t)) 16px 10px}
.topbar-inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.topbar-brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.topbar-brand .brand-mark{width:26px;height:26px;font-size:12px;border-radius:7px}
.topbar-brand .brand-mark-apex{
  background:linear-gradient(145deg,#16181f,#08090d);
  border:1px solid #3a3d46;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 3px rgba(0,0,0,.45);
  color:#e8b84b;
  font-family:Georgia,"Times New Roman",serif;
  font-size:22px;
  font-weight:900;
  line-height:1;
  text-shadow:0 1px 1px rgba(0,0,0,.65);
}
.topbar-brand span{font-weight:800;letter-spacing:.03em;font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.pill-dot{width:6px;height:6px;border-radius:50%}
.pill-green{background:var(--green-soft);color:var(--green);border-color:#134a37}
.pill-red{background:var(--red-soft);color:var(--red);border-color:#4a2226}
.pill-amber{background:var(--amber-soft);color:var(--amber);border-color:#4d3c11}
.pill-blue{background:var(--blue-soft);color:var(--blue);border-color:#1d3a63}
.pill-gray{background:var(--bg-elev-3);color:var(--text-faint);border-color:var(--border)}

.layout{display:flex;max-width:1200px;margin:0 auto}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:18px 16px calc(90px + var(--safe-b))}
@media(min-width:900px){
  .sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;padding:24px 12px;gap:2px;border-right:1px solid var(--border-soft);min-height:calc(100vh - 57px);position:sticky;top:57px;align-self:flex-start}
  .main{padding:24px 28px 40px}
  .bottomnav{display:none!important}
}
.navitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius-sm);color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:600;border:none;background:none;text-align:left;width:100%}
.navitem:hover{background:var(--bg-elev-2);color:var(--text)}
.navitem.active{background:var(--gold-soft);color:var(--gold-text)}
.navitem .ic{width:18px;text-align:center;font-size:15px}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(15,16,21,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border-soft);padding:6px 4px calc(6px + var(--safe-b))}
.bottomnav .navitem{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;text-align:center;border-radius:10px}
.bottomnav .navitem .ic{font-size:18px}

.page-title{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.page-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 20px}

.card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 14px;font-size:14px;color:var(--text-dim);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat-tile{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px}
.stat-tile .label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px}
.stat-tile .value{font-size:22px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat-tile .value.pos{color:var(--green)}
.stat-tile .value.neg{color:var(--red)}
.stat-tile .sub{font-size:11.5px;color:var(--text-faint);margin-top:4px}

.progress-wrap{margin-top:6px}
.progress-track{height:12px;border-radius:99px;background:var(--bg-elev-3);overflow:hidden;border:1px solid var(--border-soft)}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#f3cd6f);transition:width .4s ease}
.progress-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-dim)}
.progress-big{font-size:34px;font-weight:800;color:var(--gold-text)}

.empty-state{text-align:center;padding:34px 16px;color:var(--text-dim)}
.empty-state .ic{font-size:34px;margin-bottom:10px}
.empty-state h4{margin:0 0 6px;color:var(--text);font-size:16px}
.empty-state p{margin:0;font-size:13.5px;color:var(--text-faint);max-width:340px;margin:0 auto}

.stepper{display:flex;align-items:center;justify-content:center;gap:0;margin:18px 0 6px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center}
.step .dot{width:14px;height:14px;border-radius:50%;background:var(--bg-elev-3);border:2px solid var(--border)}
.step.active .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.step .lbl{font-size:11.5px;color:var(--text-faint);font-weight:600}
.step.active .lbl{color:var(--gold-text)}
.step-line{flex:0 0 40px;height:2px;background:var(--border);margin-bottom:20px}
.step-line.active{background:var(--gold)}

.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.03em}
.badge-buy{background:var(--green-soft);color:var(--green)}
.badge-sell{background:var(--red-soft);color:var(--red)}
.badge-target{background:var(--green-soft);color:var(--green)}
.badge-protected{background:var(--blue-soft);color:var(--blue)}
.badge-stopout{background:var(--red-soft);color:var(--red)}

.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;gap:12px}
.row:last-child{border-bottom:none}
.row .k{color:var(--text-dim)}
.row .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.hist-item{border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden}
.hist-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--bg-elev-2)}
.hist-head .grow{flex:1;min-width:0}
.hist-head .date{font-size:11.5px;color:var(--text-faint)}
.hist-head .pct{font-weight:800;font-variant-numeric:tabular-nums}
.hist-body{padding:12px 14px;display:none}
.hist-item.open .hist-body{display:block}
.hist-item.open .chev{transform:rotate(180deg)}
.chev{transition:transform .15s;color:var(--text-faint)}

.feed-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.feed-item:last-child{border-bottom:none}
.feed-item .t{color:var(--text-faint);font-size:11.5px;white-space:nowrap;padding-top:1px}
.feed-item .txt{color:var(--text)}

.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);gap:12px}
.toggle-row:last-child{border-bottom:none}
.toggle-row .lbl{font-weight:600;font-size:14px}
.toggle-row .hint{font-size:12px;color:var(--text-faint);margin-top:2px}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;background:var(--bg-elev-3);border:1px solid var(--border);border-radius:99px;transition:background .15s}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .track{background:var(--gold)}
.switch input:checked + .track + .knob{transform:translateX(20px)}
.switch input:checked ~ .knob{transform:translateX(20px)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}

.warn-banner{background:var(--amber-soft);border:1px solid #4d3c11;color:var(--amber);padding:12px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:16px}
.details-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0}
.details-toggle h3{margin:0}
#advanced-body{display:none;margin-top:8px}
#advanced-body.open{display:block}

.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--bg-elev-3);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red-soft);color:#ffb4b4;border-color:#4a2226}

.skel{background:linear-gradient(90deg,var(--bg-elev-2) 25%,var(--bg-elev-3) 37%,var(--bg-elev-2) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:8px}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

.acct-strip{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:16px}
.acct-strip .item .k{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em}
.acct-strip .item .v{font-weight:700;font-size:14px;margin-top:2px}

.layer-list{margin-top:10px}
.layer-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.layer-row:last-child{border-bottom:none}

.release-card{position:relative;overflow:hidden;background:linear-gradient(125deg,#171b24,#1c1d1e 58%,#242013);border-color:#594725}
.release-card:before{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(232,184,75,.06);right:-100px;top:-140px;pointer-events:none}
.release-head{display:flex;align-items:start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.release-title{font-size:18px;letter-spacing:-.025em;font-weight:800;color:#f7f7f7}
.release-caption{color:var(--text-dim);font-size:13px;line-height:1.65;margin:10px 0 16px}
.release-actions{display:flex;gap:10px;flex-wrap:wrap}
.release-actions .btn{width:auto;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.release-meta{font-size:11px;color:var(--text-faint);overflow-wrap:anywhere}
.admin-release-note{font-size:12px;color:var(--text-dim);line-height:1.65}
.container{max-width:640px}
.center-note{text-align:center;color:var(--text-faint);font-size:12.5px;margin-top:18px}
</style>
<link rel="stylesheet" href="/premium.css?v=2026-11-18" media="all">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d8b15a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apex">
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand"><div class="brand-mark">X</div><div class="brand-name">XAUCLOUD · PRIVATE</div></div>
    <h1>XauCloud Apex</h1>
    <p>Enter your Apex license to access your trading command center.</p>
    <form id="login-form">
      <input class="license-input" id="license-input" placeholder="APEX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="form-row"><button class="btn btn-primary" id="login-btn" type="submit">Continue</button></div>
    </form>
    <div class="err-box" id="login-err"></div>
    <div class="login-foot">Private access only. Contact the account owner for a license.</div>
  </div>
</div>

<div id="app-shell">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand"><div class="brand-mark brand-mark-apex" aria-label="Apex">A</div><span>XauCloud Apex</span></div>
      <div class="pills" id="status-pills" aria-live="polite"></div>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="toast" id="toast"></div>

<script src="/astra-ui.js"></script>
<script>
(function(){
'use strict';

var STATE = { me:null, page:'dashboard', pollTimer:null, adminToken:null, settingsTab:'setup', settingsExpanded:{} };

var NAV = [
  {id:'dashboard',label:'Overview'},
  {id:'campaigns',label:'Trades'},
  {id:'history',label:'History'},
  {id:'learning',label:'Insights'},
  {id:'settings',label:'Settings'},
  {id:'account',label:'Account'}
];
function navIcon(id){
  var shapes={
    dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>',
    campaigns:'<path d="M3 17l6-6 4 4 8-9"/><path d="M16 6h5v5"/>',
    history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    learning:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 2 5-7"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9L7 7m10 10 2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
    account:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'
  };
  return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(shapes[id]||shapes.dashboard)+'</svg>';
}
function openSettings(tab){
  STATE.settingsTab=tab||'setup';
  if(STATE.page==='settings')activateSettingsTab(STATE.settingsTab);
  else location.hash='#settings';
}

// ---------- api ----------
function api(path, opts){
  opts = opts || {};
  var o = { method: opts.method||'GET', headers: Object.assign({}, opts.headers||{}), credentials:'same-origin' };
  if (opts.body !== undefined){ o.body = JSON.stringify(opts.body); o.headers['content-type']='application/json'; }
  return fetch(path, o).then(function(r){
    return r.text().then(function(t){
      var data = null; try{ data = t? JSON.parse(t): {}; }catch(e){ data = {}; }
      if (!r.ok){ var err = new Error(data.error||('http_'+r.status)); err.status=r.status; err.data=data; throw err; }
      return data;
    });
  });
}

// ---------- formatting ----------
function fmtMoney(v, cur){
  if (v===undefined||v===null||!isFinite(v)) return '—';
  var s = Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return (cur==='USD'||!cur? '$':'') + s + (cur&&cur!=='USD'? ' '+cur:'');
}
function fmtPct(v, digits){
  if (v===undefined||v===null||!isFinite(v)) return '—';
  digits = digits===undefined?1:digits;
  return (v>=0?'+':'') + Number(v).toFixed(digits) + '%';
}
function fmtAgo(iso){
  if (!iso) return 'never';
  var s = Math.max(0,(Date.now()-Date.parse(iso))/1000);
  if (s<5) return 'just now';
  if (s<60) return Math.floor(s)+'s ago';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function fmtDate(iso){
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function pill(text, tone, dotColor){
  return '<span class="pill pill-'+tone+'"><span class="pill-dot" style="background:'+ (dotColor||'currentColor') +'"></span>'+esc(text)+'</span>';
}

function toast(msg, isErr){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr?' err':'');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.className='toast'; }, 3200);
}

// ---------- session bootstrap ----------
function boot(){
  // ADMIN IS SEPARATE FROM CUSTOMER LICENSE LOGIN.
  // #admin goes directly to the owner/admin authentication screen.
  if ((location.hash || '').replace('#','').indexOf('admin') === 0) {
    document.getElementById('login').style.display = 'none';
    renderAdmin();
    return;
  }

  // Normal Apex users authenticate with the license created by Admin.
  api('/api/auth/me').then(function(me){
    STATE.me = me;
    showApp();
    if (STATE.page!=='admin') startPolling();
  }).catch(function(){
    showLogin();
  });
}

function showLogin(){
  document.getElementById('login').style.display='flex';
  document.getElementById('app-shell').style.display='none';
  stopPolling();
}
function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app-shell').style.display='block';
  renderNav();
  route();
}

function licenseErrorMessage(errMsg){
  var msgs = {
    LICENSE_NOT_FOUND: 'License not found. Check the key and try again.',
    LICENSE_EXPIRED: 'This license has expired.',
    LICENSE_DISABLED: 'This license has been disabled.',
    too_many_attempts: 'Too many attempts. Please wait a few minutes and try again.',
    license_required: 'Enter your Apex license key.'
  };
  return msgs[errMsg] || 'Unable to verify license. Please try again.';
}

document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  var key = document.getElementById('license-input').value.trim().toUpperCase();
  var errBox = document.getElementById('login-err');
  var btn = document.getElementById('login-btn');
  errBox.style.display='none';
  if (!key){ errBox.textContent='Enter your Apex license key.'; errBox.style.display='block'; return; }
  btn.disabled = true; btn.textContent='Checking...';
  api('/api/auth/login', {method:'POST', body:{license:key}}).then(function(){
    btn.disabled=false; btn.textContent='Continue';
    boot();
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Continue';
    errBox.textContent = licenseErrorMessage(e.message);
    errBox.style.display='block';
  });
});

function logout(){
  api('/api/auth/logout', {method:'POST'}).then(function(){
    STATE.me = null;
    stopPolling();
    showLogin();
  });
}

// ---------- polling ----------
function startPolling(){
  stopPolling();
  STATE.pollTimer = setInterval(function(){
    api('/api/auth/me').then(function(me){
      STATE.me = me;
      renderStatusPills();
      if (['dashboard','campaigns','history','learning'].indexOf(STATE.page)>=0) renderPage();
    }).catch(function(e){
      if (e.status===401){ STATE.me=null; stopPolling(); showLogin(); }
    });
  }, 8000);
}
function stopPolling(){ if (STATE.pollTimer) clearInterval(STATE.pollTimer); STATE.pollTimer=null; }

// ---------- routing ----------
window.addEventListener('hashchange', route);
function route(){
  var h = (location.hash||'#dashboard').replace('#','');
  if (h.indexOf('admin')===0){ STATE.page='admin'; stopPolling(); renderAdmin(); return; }
  var valid = NAV.some(function(n){return n.id===h});
  STATE.page = valid? h : 'dashboard';
  renderNav();
  renderPage();
  if (!STATE.pollTimer && STATE.me) startPolling();
}

function renderNav(){
  var itemsHtml = NAV.map(function(n){
    return '<button class="navitem'+(STATE.page===n.id?' active':'')+'" data-nav="'+n.id+'"><span class="ic">'+navIcon(n.id)+'</span><span>'+n.label+'</span></button>';
  }).join('');
  var sidebar = document.getElementById('sidebar');
  var bottomnav = document.getElementById('bottomnav');
  sidebar.innerHTML = itemsHtml + '<button class="navitem" id="logout-btn" style="margin-top:auto"><span class="ic">&#10162;</span><span>Sign Out</span></button>';
  bottomnav.innerHTML = NAV.filter(function(n){return n.id!=='learning';}).map(function(n){
    return '<button class="navitem'+(STATE.page===n.id?' active':'')+'" data-nav="'+n.id+'" style="flex:1"><span class="ic">'+navIcon(n.id)+'</span><span>'+n.label+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function(el){
    el.addEventListener('click', function(){ location.hash = '#'+el.getAttribute('data-nav'); });
  });
  var lo = document.getElementById('logout-btn');
  if (lo) lo.addEventListener('click', logout);
  renderStatusPills();
}

function renderStatusPills(){
  var me=STATE.me||{}, wrap=document.getElementById('status-pills');
  var mt5=(me.mt5&&me.mt5.status)||'DISCONNECTED', connected=mt5==='CONNECTED';
  var control=me.control||{}, desired=control.desired||{}, applied=control.applied||{};
  var requested=desired.armed===true;
  var mt5Label=connected?'MT5 connected':mt5==='STALE'?'Connection delayed':'MT5 offline';
  var actionLabel=!connected?'Waiting for MT5':applied.inSync!==true?'Applying changes':requested?'Trading enabled':'Trading paused';
  wrap.innerHTML=pill(mt5Label,connected?'green':mt5==='STALE'?'amber':'gray')+
    pill(actionLabel,!connected?'gray':applied.inSync!==true?'amber':requested?'green':'gray');
}

// ---------- page render dispatch ----------
function renderPage(){
  var main = document.getElementById('main');
  var me = STATE.me || {};
  if (STATE.page==='dashboard') main.innerHTML = pageDashboard(me);
  else if (STATE.page==='campaigns') main.innerHTML = pageCampaigns(me);
  else if (STATE.page==='history') main.innerHTML = pageHistory(me);
  else if (STATE.page==='learning') main.innerHTML = pageLearning(me);
  else if (STATE.page==='settings') { main.innerHTML = pageSettings(me); wireSettings(me); }
  else if (STATE.page==='account') main.innerHTML = pageAccount(me);
  wireDashboardControls();
  if(STATE.page==='settings'&&window.AstraUI)window.AstraUI.bind(async function(){STATE.me=await api('/api/auth/me');renderPage();});
}

function setupGatePill(ok, required, available){

}

function watchingCard(me){
  var s = me.setupStatus || null;
  var active = !!(s && s.active && (s.state==='WATCHING'||s.state==='CONFIRMED'));
  var recentTerminal = !!(s && !s.active && Number.isFinite(Number(s.eventAgeSec)) && Number(s.eventAgeSec)<20*60);

  if (!active && !recentTerminal){
    return '<div class="card"><div class="empty-state"><div class="ic">&#128269;</div><h4>APEX IS SCANNING</h4>'
      + '<p>Waiting for a high-quality setup. When one is armed, this card will show its live score and every confirmation gate.</p></div>'
      + '<div class="stepper">'
      + '<div class="step active"><div class="dot"></div><div class="lbl">Scanning</div></div>'
      + '<div class="step-line"></div>'
      + '<div class="step"><div class="dot"></div><div class="lbl">Confirming Setup</div></div>'
      + '</div></div>';
  }

  if (recentTerminal){
    var terminalText = s.state==='EXPIRED'
      ? 'The setup did not complete before the configured watch timeout. Apex discarded it and resumed scanning.'
      : s.state==='INVALIDATED'
      ? 'Price printed a new extreme beyond the swept level, invalidating the rejection thesis. Apex resumed scanning.'
      : s.state==='CONSUMED'
      ? 'This setup was consumed by a campaign. Apex will scan again whenever it is idle.'
      : 'Apex cancelled this setup and resumed scanning.';
    return '<div class="card"><div class="empty-state"><div class="ic">&#128269;</div><h4>SETUP '+esc(s.state)+' — SCANNING AGAIN</h4>'
      + '<p>'+esc(terminalText)+'</p></div>'
      + '<div class="row"><span class="k">Direction</span><span class="v">'+esc(s.direction||'—')+'</span></div>'
      + '<div class="row"><span class="k">Setup ID</span><span class="v" style="font-size:11px">'+esc(s.setupId||'—')+'</span></div>'
      + '<div class="row"><span class="k">Reason</span><span class="v">'+esc(s.reason||s.state||'—')+'</span></div>'
      + (s.score==null?'':'<div class="row"><span class="k">Last score</span><span class="v">'+Number(s.score).toFixed(0)+' / '+(s.requiredScore==null?'—':Number(s.requiredScore).toFixed(0))+'</span></div>')
      + '<div class="stepper">'
      + '<div class="step active"><div class="dot"></div><div class="lbl">Scanning</div></div>'
      + '<div class="step-line"></div>'
      + '<div class="step"><div class="dot"></div><div class="lbl">Confirming Setup</div></div>'
      + '</div></div>';
  }

  var score = s.score==null ? null : Number(s.score);
  var required = s.requiredScore==null ? null : Number(s.requiredScore);
  var scorePct = score!=null && required>0 ? Math.min(100,Math.max(0,(score/required)*100)) : 0;
  var scoreReady = score!=null && required!=null && score>=required;
  var title = s.state==='CONFIRMED' ? 'SETUP CONFIRMED — SUBMITTING' : 'CONFIRMING '+esc(s.direction||'')+' SETUP';

  var html = '<div class="card"><div class="empty-state" style="padding-bottom:18px"><div class="ic">&#128269;</div><h4>'+title+'</h4>'
    + '<p>Authoritative EA setup '+esc(s.setupId||'—')+'. This is live strategy telemetry, not a dashboard guess.</p></div>';

  if (score!=null){
    html += '<div class="progress-wrap"><div class="progress-big">'+score.toFixed(0)+' <span style="font-size:14px;color:var(--text-dim)">/ '+(required==null?'—':required.toFixed(0))+' required</span></div>'
      + '<div class="progress-track"><div class="progress-fill" style="width:'+scorePct+'%"></div></div></div>';
  }

  html += '<div class="row"><span class="k">Entry score</span><span class="v">'+(score==null?'—':score.toFixed(0))+' '+(required==null?'':setupGatePill(scoreReady,true,true))+'</span></div>'
    + '<div class="row"><span class="k">Rejection</span><span class="v">'+setupGatePill(!!s.rejected,true,true)+'</span></div>'
    + '<div class="row"><span class="k">Micro BOS</span><span class="v">'+setupGatePill(!!s.microBreak,true,true)+'</span></div>'
    + '<div class="row"><span class="k">M3 confirmation</span><span class="v">'+setupGatePill(!!s.m3Gate,!!s.requireM3,s.m3Available!==false)+'</span></div>'
    + '<div class="row"><span class="k">M5 context</span><span class="v">'+setupGatePill(!!s.m5Gate,!!s.requireM5,s.m5Available!==false)+'</span></div>'
    + '<div class="row"><span class="k">Waiting for</span><span class="v">'+esc((s.waitReason||'—').replace(/_/g,' '))+'</span></div>'
    + '<div class="row"><span class="k">BOS type</span><span class="v">'+esc(s.bosKind||'NONE')+'</span></div>'
    + '<div class="row"><span class="k">Setup age</span><span class="v">'+(s.setupAgeSec==null?'—':Math.max(0,Math.round(Number(s.setupAgeSec)))+'s')+'</span></div>'
    + '<div class="row"><span class="k">Setup ID</span><span class="v" style="font-size:11px">'+esc(s.setupId||'—')+'</span></div>';

  if (score!=null){
    html += '<div style="margin-top:14px"><h3>Score components</h3>'
      + '<div class="row"><span class="k">Base</span><span class="v">+'+Number(s.basePoints||0).toFixed(1)+'</span></div>'
      + '<div class="row"><span class="k">Impulse</span><span class="v">+'+Number(s.impulsePoints||0).toFixed(1)+'</span></div>'
      + '<div class="row"><span class="k">Rejection</span><span class="v">+'+Number(s.rejectionPoints||0).toFixed(1)+'</span></div>'
      + '<div class="row"><span class="k">Micro BOS</span><span class="v">+'+Number(s.bosPoints||0).toFixed(1)+'</span></div>'
      + '<div class="row"><span class="k">M3</span><span class="v">+'+Number(s.m3Points||0).toFixed(1)+'</span></div>'
      + '<div class="row"><span class="k">M5</span><span class="v">+'+Number(s.m5Points||0).toFixed(1)+'</span></div>'
      + '<div class="row"><span class="k">Wick quality</span><span class="v">+'+Number(s.wickPoints||0).toFixed(1)+'</span></div>'
      + '</div>';
  }

  html += '<div class="stepper">'
    + '<div class="step"><div class="dot"></div><div class="lbl">Scanning</div></div>'
    + '<div class="step-line active"></div>'
    + '<div class="step active"><div class="dot"></div><div class="lbl">Confirming Setup</div></div>'
    + '</div></div>';
  return html;
}

function ratchetLadderHtml(trigger, lock, step, lockStep, enabled){
  if (!enabled) return '<div class="empty-state" style="padding:14px"><p>Profit Ratchet is off. The basket will only exit via the hard Take Profit (if set above 0) or the fixed master stop-loss.</p></div>';
  trigger = Number(trigger)||0; lock = Number(lock)||0; step = Number(step)||0; lockStep = Number(lockStep)||0;
  if (trigger<=0 || step<=0) return '<div class="empty-state" style="padding:14px"><p>Enter a trigger % and step % above 0 to preview the ladder.</p></div>';
  var rows = '';
  for (var i=0;i<4;i++){
    var peak = trigger + step*i;
    var protectedPct = lock + lockStep*i;
    rows += '<div class="row"><span class="k">+'+peak.toFixed(0)+'% peak</span><span class="v">+'+protectedPct.toFixed(0)+'% protected</span></div>';
  }
  return '<h3 style="margin-bottom:6px">Preview</h3>' + rows + '<div class="hint" style="margin-top:8px">...and so on, ratcheting forward. Never decreases when profit retraces.</div>';
}
function updateRatchetPreview(){
  var box = document.getElementById('ratchet-preview');
  if (!box) return;
  var enabled = document.getElementById('f-profitRatchetEnabled').checked;
  var trigger = document.getElementById('f-ratchetTriggerPct').value;
  var lock = document.getElementById('f-ratchetLockPct').value;
  var step = document.getElementById('f-ratchetStepPct').value;
  var lockStep = document.getElementById('f-ratchetLockStepPct').value;
  box.innerHTML = ratchetLadderHtml(trigger, lock, step, lockStep, enabled);
}

function wireDashboardControls(){
  var t = document.getElementById('arm-toggle');
  if (t) t.addEventListener('change', function(){
    var val = t.checked;
    t.disabled = true;
    api('/api/session/config', {method:'POST', body:{armed:val}}).then(function(r){
      var d = (r && r.delivery) || '';
      if (d==='BRIDGE_NOT_CONFIGURED') toast('Saved locally — bridge not configured; EA will not see this yet', true);
      else if (d==='QUEUED_FOR_BRIDGE') toast(val? 'Arm queued — waiting for bridge/EA' : 'Disarm queued — waiting for bridge/EA');
      else if (d==='EA_APPLIED' || r.inSync) toast(val? ('Apex armed — EA applied revision '+r.desiredRevision) : ('Apex disarmed — EA applied revision '+r.desiredRevision));
      else toast(val? 'Arm queued — waiting for EA' : 'Disarm queued — waiting for EA');
      return api('/api/auth/me');
    }).then(function(me){ STATE.me=me; renderStatusPills(); if (STATE.page==='dashboard'||STATE.page==='settings') renderPage(); t.disabled=false; })
    .catch(function(){ toast('Could not update — try again', true); t.checked=!val; t.disabled=false; });
  });
}

    + advField('Sweep ATR', 'sweepAtr', adv.sweepAtr, disabled)
    + advField('Rejection Bars', 'rejectionBars', adv.rejectionBars, disabled)
    + advField('Watch Expiry (min)', 'watchExpiryMinutes', adv.watchExpiryMinutes, disabled)
    + advField('Rejection Zone ATR', 'rejectionZoneAtr', adv.rejectionZoneAtr, disabled)
    + advField('Add Spacing ATR', 'addSpacingAtr', adv.addSpacingAtr, disabled)
    + '</div>'
    + '<div class="toggle-row"><div class="lbl">Require M3 Confirmation</div><label class="switch"><input type="checkbox" id="f-requireM3Confirm" '+(adv.requireM3Confirm?'checked':'')+' '+(disabled?'disabled':'')+'><span class="track"></span><span class="knob"></span></label></div>'
    + '<div class="toggle-row"><div class="lbl">Require M5 Context</div><label class="switch"><input type="checkbox" id="f-requireM5Context" '+(adv.requireM5Context?'checked':'')+' '+(disabled?'disabled':'')+'><span class="track"></span><span class="knob"></span></label></div>'
    + '<div class="form-row"><button class="btn btn-primary" id="save-advanced" '+(disabled?'disabled':'')+'>Save Advanced Settings</button></div>'
    + '</div></div>';
  return html;
}
function advField(label, id, value, disabled){
  return '<div class="field"><label>'+esc(label)+'</label><input type="number" step="any" id="f-'+id+'" value="'+esc(value)+'" '+(disabled?'disabled':'')+'></div>';
}
function wireSettings(me){
  wireDashboardControls();
  var changeBtn = document.getElementById('change-license-btn');
  if (changeBtn) changeBtn.addEventListener('click', function(){
    var key = document.getElementById('f-change-license').value.trim().toUpperCase();

    if (!key){ errBox.textContent='Enter an Apex license key.'; errBox.style.display='block'; return; }
    changeBtn.disabled = true; changeBtn.textContent='Checking...';
    api('/api/auth/login', {method:'POST', body:{license:key}}).then(function(){
      changeBtn.disabled=false; changeBtn.textContent='Change License';
      toast('License changed');
      return api('/api/auth/me');
    }).then(function(newMe){
      STATE.me = newMe;
      renderStatusPills();
      if (STATE.page==='settings') renderPage();

      changeBtn.disabled=false; changeBtn.textContent='Change License';

  });
  var advToggle = document.getElementById('advanced-toggle');

    document.getElementById('advanced-body').classList.toggle('open');

  var save1 = document.getElementById('save-settings');

  var saveMargin = document.getElementById('save-margin');

  var saveSl = document.getElementById('save-sl');

    var payload = {
      normalFixedSLGoldMove: Number(document.getElementById('f-normalFixedSLGoldMove').value),
      maxLayers: Number(document.getElementById('f-maxLayers').value)
    };
    saveConfig(payload, 'save-sl', 'Save');

  var saveBe = document.getElementById('save-be');
  if (saveBe) saveBe.addEventListener('click', function(){
    var payload = {
      masterBreakEvenEnabled: document.getElementById('f-masterBreakEvenEnabled').checked,
      masterBreakEvenTriggerPct: Number(document.getElementById('f-masterBreakEvenTriggerPct').value)
    };
    saveConfig(payload, 'save-be', 'Save Break-Even');
  });
  var saveRecovery = document.getElementById('save-recovery');
  if (saveRecovery) saveRecovery.addEventListener('click', function(){
    var payload = {
      recoveryExitEnabled: document.getElementById('f-recoveryExitEnabled').checked,
      recoveryExitArmPctOfSL: Number(document.getElementById('f-recoveryExitArmPctOfSL').value)
    };
    saveConfig(payload, 'save-recovery', 'Save Recovery-To-Entry');
  });
  var saveRatchet = document.getElementById('save-ratchet');
  if (saveRatchet) saveRatchet.addEventListener('click', function(){
    var payload = {
      profitRatchetEnabled: document.getElementById('f-profitRatchetEnabled').checked,
      ratchetTriggerPct: Number(document.getElementById('f-ratchetTriggerPct').value),
      ratchetLockPct: Number(document.getElementById('f-ratchetLockPct').value),
      ratchetStepPct: Number(document.getElementById('f-ratchetStepPct').value),
      ratchetLockStepPct: Number(document.getElementById('f-ratchetLockStepPct').value)
    };
    saveConfig(payload, 'save-ratchet', 'Save Profit Ratchet');
  });
  ['f-profitRatchetEnabled','f-ratchetTriggerPct','f-ratchetLockPct','f-ratchetStepPct','f-ratchetLockStepPct'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.addEventListener('input', updateRatchetPreview);
  });
  updateRatchetPreview();
  var save2 = document.getElementById('save-advanced');
  if (save2) save2.addEventListener('click', function(){
    var payload = {
      entryScore: Number(document.getElementById('f-entryScore').value),
      addScore: Number(document.getElementById('f-addScore').value),
      impulseAtr: Number(document.getElementById('f-impulseAtr').value),
      sweepAtr: Number(document.getElementById('f-sweepAtr').value),
      rejectionBars: Number(document.getElementById('f-rejectionBars').value),
      watchExpiryMinutes: Number(document.getElementById('f-watchExpiryMinutes').value),
      rejectionZoneAtr: Number(document.getElementById('f-rejectionZoneAtr').value),
      addSpacingAtr: Number(document.getElementById('f-addSpacingAtr').value),
      requireM3Confirm: document.getElementById('f-requireM3Confirm').checked,
      requireM5Context: document.getElementById('f-requireM5Context').checked
    };

}
function saveConfig(payload, btnId, btnLabel){
  var btn = btnId ? document.getElementById(btnId) : null;
  if (btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  api('/api/session/config', {method:'POST', body:payload}).then(function(r){
    var d = (r && r.delivery) || '';
    if (d==='BRIDGE_NOT_CONFIGURED') toast('Saved locally — bridge not configured; EA will not see this yet', true);
    else if (d==='QUEUED_FOR_BRIDGE') toast('Saved — queued for bridge/EA (revision '+(r.desiredRevision||r.commandRevision||'')+')');
    else if (d==='BRIDGE_FAILED') toast('Saved locally — bridge delivery failed', true);
    else if (d==='EA_APPLIED' || r.inSync) toast('Saved — EA applied revision '+(r.appliedRevision||r.desiredRevision||''));
    else toast('Saved — waiting for EA to apply revision '+(r.desiredRevision||r.commandRevision||''));
    return api('/api/auth/me');
  }).then(function(me){
    STATE.me=me;
    if (btn){ btn.disabled=false; btn.textContent=btnLabel||'Save'; }
    if (STATE.page==='settings') renderPage();
  }).catch(function(e){
    if (btn){ btn.disabled=false; btn.textContent=btnLabel||'Save'; }
    var err = (e && e.data && e.data.error) || (e && e.message) || '';
    var msg = 'Could not save settings';
    if (err==='UNLIMITED_NOT_ENTITLED') msg = 'UNLIMITED is not enabled on this license';
    else if (err==='invalid_json' || err==='invalid_config') msg = 'Could not save — try again';
    toast(msg, true);
  });
}

    + '<div class="row"><span class="k">License Key</span><span class="v" style="font-size:12.5px">'+esc(lic.key)+'</span></div>'

    + '<div class="row"><span class="k">Account Profile</span><span class="v">'+esc(lic.accountProfile||'—')+'</span></div>'
    + '<div class="row"><span class="k">Expires</span><span class="v">'+(lic.expiresAt? esc(fmtDate(lic.expiresAt)) : 'No expiry')+'</span></div>'

    + '<li>Enable Algo Trading (the button in the MT5 toolbar).</li>'

// ---------- Admin (separate protected route, ADMIN_TOKEN, in-memory only) ----------
function renderAdmin(){
  document.getElementById('login').style.display='none';
  document.getElementById('app-shell').style.display='block';
  document.getElementById('sidebar').innerHTML='';
  document.getElementById('bottomnav').innerHTML='';
  document.getElementById('status-pills').innerHTML = pill('Admin Console','amber');
  var main = document.getElementById('main');
  if (!STATE.adminToken){
    main.innerHTML = '<div class="container"><h1 class="page-title">Admin Access</h1><p class="page-sub">Internal administration only. Not the normal Apex login.</p>'
      + '<div class="card"><div class="field"><label>Admin Token</label><input type="password" id="admin-token-input"></div>'
      + '<button class="btn btn-primary" id="admin-token-go">Continue</button></div></div>';
    document.getElementById('admin-token-go').addEventListener('click', function(){
      STATE.adminToken = document.getElementById('admin-token-input').value.trim();
      renderAdmin();
    });
    return;
  }
  main.innerHTML = '<div class="container"><h1 class="page-title">Admin Console</h1><p class="page-sub">License issuance and raw backend state.</p><div id="admin-body"><div class="skel" style="height:200px"></div></div></div>';
  Promise.all([adminApi('/api/admin/licenses'),adminApi('/api/admin/release')]).then(function(results){
    renderAdminLicenses(results[0].licenses||[],results[1].release||{});
  }).catch(function(){
    document.getElementById('admin-body').innerHTML = '<div class="card"><div class="empty-state"><h4>Invalid admin token</h4></div></div>';
    STATE.adminToken = null;
  });
}
function adminApi(path, opts){
  opts = opts||{};
  opts.headers = Object.assign({}, opts.headers||{}, {authorization:'Bearer '+STATE.adminToken});
  return api(path, opts);
}
function renderAdminLicenses(licenses,release){
  var html = '<div class="card"><h3>Issue New License</h3>'
    + '<div class="field-grid">'
    + '<div class="field"><label>Account Profile</label><select id="new-lic-profile"><option value="NORMAL">NORMAL</option><option value="UNLIMITED">UNLIMITED</option></select></div>'
    + '<div class="field"><label>Customer (optional)</label><input id="new-lic-customer"></div>'
    + '<div class="field"><label>Expires (optional, YYYY-MM-DD)</label><input id="new-lic-expiry"></div>'
    + '</div><button class="btn btn-primary" id="new-lic-btn">Create License</button></div>';

  html += '<div class="card"><h3>Licenses</h3>';
  if (!licenses.length) html += '<div class="empty-state"><p>No licenses issued yet.</p></div>';
  licenses.forEach(function(l){
    html += '<div class="row" style="flex-wrap:wrap;align-items:flex-start">'
      + '<span class="k" style="flex:1;min-width:200px"><b>'+esc(l.key)+'</b><br><span style="color:var(--text-faint);font-size:11.5px">'+esc(l.status)+' · '+esc(l.accountProfile)+' · account: '+esc(l.account||'unbound')+'</span></span>'
      + '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;min-height:32px" data-toggle-lic="'+esc(l.key)+'" data-status="'+esc(l.status)+'">'+(l.status==='ACTIVE'?'Disable':'Enable')+'</button>'
      + '</div>';
  });
  html += '</div>';
  var active=licenses.filter(function(l){return l.status==='ACTIVE';});
  html += '<div class="card release-card"><div class="release-head"><h3>Official Apex bot release</h3>'
    +pill(release.available?'v'+release.version+' Published':'Awaiting compiled .ex5',release.available?'green':'amber')+'</div>'
    +'<p class="release-caption">Publish the actual MetaEditor-compiled bot to make it available for every active-license dashboard and for email delivery. Source files alone are not enough.</p>'
    +'<div class="field"><label>Compiled Apex file (.ex5)</label><input type="file" accept=".ex5,application/octet-stream" id="admin-release-file"></div>'
    +'<label style="display:flex;align-items:flex-start;gap:10px;margin:14px 0;font-size:12px;color:var(--text-dim)"><input type="checkbox" style="width:auto;min-height:auto;margin-top:2px" id="admin-release-confirm">I compiled this exact v'+esc(release.version||'3.10.0')+' Apex source in MetaEditor, checked the version and confirmed the build has no compile errors.</label>'
    +'<button class="btn btn-primary" id="admin-publish-release">Publish Latest Apex .ex5</button>'
    +'<div class="admin-release-note" id="admin-release-status" role="status" style="margin-top:12px">'+(release.available?'Current SHA-256: '+esc(release.sha256):'No compiled bot is available for customers yet.')+'</div></div>';
  html += '<div class="card"><h3>Email Apex to a customer</h3>'
    +'<p class="release-caption">Send the latest compiled bot as an attachment with a premium step-by-step activation guide using XauCloud email.</p>'
    +'<div class="field"><label>Customer email</label><input type="email" id="apex-send-recipient" placeholder="customer@example.com" autocomplete="off"></div>'
    +'<div class="field"><label>Active Apex license</label><select id="apex-send-license"><option value="">Choose a license</option>'
    +active.map(function(l){return '<option value="'+esc(l.key)+'">'+esc(l.key)+' · '+esc(l.customer||'Customer')+'</option>';}).join('')
    +'</select></div>'
    +'<button class="btn btn-primary" id="apex-send-email" '+(!release.available||!active.length?'disabled':'')+'>Send Apex Bot &amp; Setup Email</button>'
    +'<div class="admin-release-note" id="apex-email-result" role="status" style="margin-top:12px">'+(!release.available?'Publish a compiled release before sending emails.':'Includes MT5 installation, activation, and optional Astra API key configuration.')+'</div></div>';
  document.getElementById('admin-body').innerHTML = html;
  document.getElementById('admin-publish-release').addEventListener('click', async function(){
    var btn=this,file=document.getElementById('admin-release-file').files[0];
    var status=document.getElementById('admin-release-status');
    if(!file||!file.name.toLowerCase().endsWith('.ex5')){status.textContent='Choose a compiled .ex5 file.';return;}
    if(file.size<8192||file.size>5000000){status.textContent='The compiled .ex5 must be between 8 KB and 5 MB.';return;}
    if(!document.getElementById('admin-release-confirm').checked){status.textContent='Confirm the compiled version first.';return;}
    btn.disabled=true;status.textContent='Publishing and checking the release…';
    try{
      var encoded=await new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(String(reader.result).split(',')[1]);};reader.onerror=function(){reject(new Error('Unable to read selected file'));};reader.readAsDataURL(file);});
      var reply=await adminApi('/api/admin/release',{method:'POST',body:{
        version:release.version,fileBase64:encoded,confirmed:true
      }});
      status.textContent='Release published: v'+reply.release.version+'. Customer downloads are now available.';
      renderAdmin();
    }catch(e){status.textContent='Publish failed: '+e.message;btn.disabled=false;}
  });
  document.getElementById('apex-send-email').addEventListener('click',function(){
    var btn=this,recipient=document.getElementById('apex-send-recipient').value.trim();
    var license=document.getElementById('apex-send-license').value;
    var result=document.getElementById('apex-email-result');
    if(!recipient||!document.getElementById('apex-send-recipient').checkValidity()||!license){
      result.textContent='Enter a valid customer email and choose their active license.';return;
    }
    btn.disabled=true;result.textContent='Sending the compiled Apex bot and setup guide through XauCloud…';
    adminApi('/api/admin/install-email',{method:'POST',body:{recipient:recipient,license:license}})
      .then(function(r){result.textContent='Accepted by XauCloud email service for '+recipient+' · v'+r.version;toast('Apex setup email sent');})
      .catch(function(e){result.textContent=e.data&&e.data.deliveryUnknown
        ? 'Delivery is uncertain. Check XauCloud sender logs before attempting another send.'
        : 'Email failed: '+e.message;toast('Email not confirmed',true);})
      .finally(function(){btn.disabled=false;});
  });
  document.getElementById('new-lic-btn').addEventListener('click', function(){
    var expiry = document.getElementById('new-lic-expiry').value.trim();
    adminApi('/api/admin/licenses', {method:'POST', body:{
      accountProfile: document.getElementById('new-lic-profile').value,
      customer: document.getElementById('new-lic-customer').value.trim(),
      expiresAt: expiry? new Date(expiry).toISOString() : null
    }}).then(function(d){
      toast('License created: '+d.license.key);
      renderAdmin();
    }).catch(function(){ toast('Failed to create license', true); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-lic]'), function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-toggle-lic');
      var cur = btn.getAttribute('data-status');
      adminApi('/api/admin/licenses', {method:'POST', body:{key:key, status: cur==='ACTIVE'?'DISABLED':'ACTIVE'}}).then(function(){
        renderAdmin();
      });
    });
  });
}

boot();
})();
